<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Router</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; margin: 10px 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Test Router Navigation</h1>
    
    <div>
        <button onclick="testRouter()">Test Router Availability</button>
        <button onclick="testNavigation()">Test Navigation</button>
    </div>
    
    <div id="results"></div>

    <script>
        function testRouter() {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result';
            
            if (typeof window.app !== 'undefined') {
                if (typeof window.app.router !== 'undefined') {
                    if (typeof window.app.router.navigate === 'function') {
                        resultDiv.className += ' success';
                        resultDiv.innerHTML = '✅ Router is available and navigate function exists';
                    } else {
                        resultDiv.className += ' error';
                        resultDiv.innerHTML = '❌ Router exists but navigate function is missing';
                    }
                } else {
                    resultDiv.className += ' error';
                    resultDiv.innerHTML = '❌ window.app exists but router is missing';
                }
            } else {
                resultDiv.className += ' error';
                resultDiv.innerHTML = '❌ window.app is not defined';
            }
            
            resultsDiv.appendChild(resultDiv);
        }

        function testNavigation() {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result';
            
            try {
                if (window.app && window.app.router && window.app.router.navigate) {
                    // Test navigation to challenges page
                    window.app.router.navigate('/challenges');
                    resultDiv.className += ' success';
                    resultDiv.innerHTML = '✅ Navigation to /challenges successful';
                } else {
                    resultDiv.className += ' error';
                    resultDiv.innerHTML = '❌ Router not available for navigation';
                }
            } catch (error) {
                resultDiv.className += ' error';
                resultDiv.innerHTML = `❌ Navigation failed: ${error.message}`;
            }
            
            resultsDiv.appendChild(resultDiv);
        }

        // Test on page load
        window.addEventListener('load', () => {
            setTimeout(testRouter, 1000); // Wait a bit for app to initialize
        });
    </script>
</body>
</html>
