<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Services Health Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .service {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }

        .online {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .offline {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        .testing {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
        }

        button {
            padding: 10px 20px;
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <h1>Backend Services Health Check</h1>
    <button onclick="checkAllServices()">Check All Services</button>

    <div id="results">
        <div id="api-gateway" class="service testing">API Gateway (8080): Testing...</div>
        <div id="idea-service" class="service testing">Idea Service (8081): Testing...</div>
        <div id="user-service" class="service testing">User Service (8082): Testing...</div>
        <div id="voting-service" class="service testing">Voting Service (8083): Testing...</div>
        <div id="gamification-service" class="service testing">Gamification Service (8084): Testing...</div>
        <div id="ai-service" class="service testing">AI Service (8085): Testing...</div>
    </div>

    <script>
        async function checkService(name, port, path = '') {
            const element = document.getElementById(name);
            try {
                const response = await fetch(`http://localhost:${port}${path}`, {
                    method: 'GET',
                    mode: 'cors'
                });

                if (response.ok) {
                    element.className = 'service online';
                    element.textContent = `${name.replace('-', ' ').toUpperCase()} (${port}): ✅ Online`;
                } else {
                    element.className = 'service offline';
                    element.textContent = `${name.replace('-', ' ').toUpperCase()} (${port}): ❌ Error ${response.status}`;
                }
            } catch (error) {
                element.className = 'service offline';
                element.textContent = `${name.replace('-', ' ').toUpperCase()} (${port}): ❌ Offline - ${error.message}`;
            }
        }

        async function checkAllServices() {
            // Reset all to testing state
            document.querySelectorAll('.service').forEach(el => {
                el.className = 'service testing';
                el.textContent = el.textContent.replace(/: .+/, ': Testing...');
            });

            // Check each service
            await Promise.all([
                checkService('api-gateway', 8080, '/actuator/health'),
                checkService('idea-service', 8081, '/actuator/health'),
                checkService('user-service', 8082, '/actuator/health'),
                checkService('voting-service', 8083, '/actuator/health'),
                checkService('gamification-service', 8084, '/actuator/health'),
                checkService('ai-service', 8085, '/actuator/health')
            ]);
        }

        // Auto-check on page load
        window.onload = () => {
            setTimeout(checkAllServices, 1000);
        };
    </script>
</body>

</html>
