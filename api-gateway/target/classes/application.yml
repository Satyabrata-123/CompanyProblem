server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: idea-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/ideas/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

        - id: voting-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/votes/**
          filters:
            - StripPrefix=1

        - id: gamification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/gamification/**
          filters:
            - StripPrefix=1

        - id: ai-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1

        - id: company-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/companies/**,/api/challenges/**,/api/solutions/**
          filters:
            - StripPrefix=1

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
