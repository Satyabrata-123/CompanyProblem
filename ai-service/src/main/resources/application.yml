server:
  port: 8085

spring:
  application:
    name: ai-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# AI Configuration
ai:
  gemini:
    api-key: YOUR_REAL_GEMINI_API_KEY_HERE  # Replace this with your actual 39+ character API key from Google AI Studio
    base-url: https://generativelanguage.googleapis.com/v1
    model: gemini-2.0-flash